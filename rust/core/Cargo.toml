[package]
name = "translatecore"
version = "0.1.0"
edition = "2021"
description = "Native translation pipeline core (VAD/ASR/MT/TTS orchestration). PoC stage."

[lib]
name = "translatecore"
# cdylib: loaded by the Android app via JNA. staticlib kept for future iOS/desktop linking.
crate-type = ["cdylib", "staticlib"]

# uniffi-bindgen binary lives in this crate so bindings are generated from the
# exact same uniffi version the library was built with (avoids version drift).
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1"
# Translation runtime: load-dynamic dlopens the existing libonnxruntime.so at
# runtime (onnxruntime 1.24, matching the sherpa-bundled lib) — no link/build.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
# unstable_wasm: pure-Rust regex (no oniguruma C dep) — needed for Android cross-build.
tokenizers = { version = "0.20", default-features = false, features = ["unstable_wasm"] }
